  <rect x="140" y="76" width="200" height="424" rx="8" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".9"/>
  <rect x="140" y="76" width="200" height="424" rx="8" fill="none" stroke="#B7C3CA" stroke-width="2"/>
  <!-- interior slab seam -->
  <rect x="162" y="98" width="156" height="180" rx="10" fill="#F6F8F9" stroke="#C3CDD3" stroke-width="3"/>
  <rect x="162" y="304" width="156" height="190" rx="10" fill="#F6F8F9" stroke="#C3CDD3" stroke-width="3"/>
  <!-- drainage detail -->
