  <!-- handle -->
  <rect x="270" y="356" width="58" height="26" rx="13" fill="#8B989F"/>
  <rect x="276" y="360" width="46" height="18" rx="9" fill="#F2F5F7"/>
  <circle cx="278" cy="369" r="3" fill="#8B989F"/>
  <!-- lock -->
  <rect x="252" y="352" width="10" height="34" rx="4" fill="#9AA7AE"/>
  <!-- window small -->
