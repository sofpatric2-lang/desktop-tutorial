<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE4E8"/>
      <stop offset="1" stop-color="#AEC0C9"/>
    </linearGradient>
    <linearGradient id="pvc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDFEFE"/>
      <stop offset=".55" stop-color="#EEF2F4"/>
      <stop offset="1" stop-color="#D3DBE0"/>
    </linearGradient>
    <radialGradient id="pglow" cx=".3" cy=".15" r=".85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="560" fill="url(#pbg)"/>
  <rect width="480" height="560" fill="url(#pglow)"/>
  <ellipse cx="240" cy="514" rx="152" ry="12" fill="#5E7480" opacity=".3"/>
  <rect x="104" y="508" width="272" height="10" rx="5" fill="#7C93A0" opacity=".7"/>
